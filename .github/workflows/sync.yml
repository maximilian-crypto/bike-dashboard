name: Sync Strava + Whoop

# Holt regelmäßig neue Daten in die Neon-Datenbank – ersetzt den Windows-
# Taskplaner, läuft auch wenn der PC aus ist. Morgens dichter, damit der
# Morgen-Report rausgeht, sobald die Whoop-Recovery da ist (spätestens 10:00
# deutscher Zeit; Frist und Entscheidung stehen in bikedash/report.py).
on:
  schedule:
    - cron: "0 */4 * * *"      # alle 4 Stunden (UTC)
    - cron: "*/30 5-9 * * *"   # Morgenfenster: 07:00–11:30 DE-Sommerzeit, 06:00–10:30 Winterzeit
  workflow_dispatch: {}      # zusätzlich manuell auslösbar

concurrency:
  group: bikedash-sync
  cancel-in-progress: false

permissions:
  contents: write   # damit der Job das aktualisierte mobile/today.json committen darf

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          ATHLETE_HOME_LAT: ${{ secrets.ATHLETE_HOME_LAT }}
          ATHLETE_HOME_LON: ${{ secrets.ATHLETE_HOME_LON }}
        run: python sync.py

      - name: Tagesplan für die PWA bauen (mobile/today.json, route-frei)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ATHLETE_HOME_LAT: ${{ secrets.ATHLETE_HOME_LAT }}   # nur fürs Wetter
          ATHLETE_HOME_LON: ${{ secrets.ATHLETE_HOME_LON }}
          # Zonen und Trainingslast müssen hier identisch zum Dashboard
          # gerechnet werden, sonst weicht today.json davon ab.
          ATHLETE_LTHR: ${{ secrets.ATHLETE_LTHR }}
          ATHLETE_FTP: ${{ secrets.ATHLETE_FTP }}
          ATHLETE_WEIGHT_KG: ${{ secrets.ATHLETE_WEIGHT_KG }}
          ATHLETE_SEASON_START: ${{ secrets.ATHLETE_SEASON_START }}
          # Tagesworkout automatisch nach Zwift (über intervals.icu). Fehlen die
          # beiden, wird der Schritt still übersprungen (today.json: zwift.status).
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
        run: python build_today.py

      - name: Morgen-Report aufs Handy (nur wenn fällig)
        # Sendet einmal pro Tag: sobald die heutige Whoop-Recovery da ist,
        # spätestens zur Frist. Läuft NACH build_today, damit die Zwift-Zeile
        # stimmt. Fehler hier dürfen den Sync nicht rot machen.
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          ATHLETE_HOME_LAT: ${{ secrets.ATHLETE_HOME_LAT }}
          ATHLETE_HOME_LON: ${{ secrets.ATHLETE_HOME_LON }}
          ATHLETE_LTHR: ${{ secrets.ATHLETE_LTHR }}
          ATHLETE_FTP: ${{ secrets.ATHLETE_FTP }}
          ATHLETE_WEIGHT_KG: ${{ secrets.ATHLETE_WEIGHT_KG }}
          ATHLETE_SEASON_START: ${{ secrets.ATHLETE_SEASON_START }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python send_report.py --if-due

      - name: today.json committen (nur bei Änderung)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile/today.json
          if git diff --staged --quiet; then
            echo "today.json unverändert – nichts zu committen."
          else
            git commit -m "chore: Tagesplan (today.json) aktualisieren [skip ci]"
            git push
          fi
