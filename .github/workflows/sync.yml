name: Sync Strava + Whoop

# Holt regelmäßig neue Daten in die Neon-Datenbank – ersetzt den Windows-
# Taskplaner, läuft auch wenn der PC aus ist. Morgens dichter, damit der
# Morgen-Report rausgeht, sobald die Whoop-Recovery da ist (spätestens 10:00
# deutscher Zeit; Frist und Entscheidung stehen in bikedash/report.py).
on:
  schedule:
    # Bewusst krumme Minuten: GitHub verwirft Zeitplan-Läufe zur vollen und
    # halben Stunde bei Last reihenweise. Mit "*/30 5-9" kamen von zehn
    # Morgen-Slots meist nur zwei an (erst ~10:55 DE), am 27.09. gar keiner —
    # kein Lauf, kein Morgen-Report.
    - cron: "13 */4 * * *"                # alle 4 Stunden (UTC)
    - cron: "4,19,34,49 4-9 * * *"        # Morgenfenster: 06:04–11:49 DE-Sommerzeit, 05:04–10:49 Winterzeit
  workflow_dispatch: {}      # zusätzlich manuell auslösbar

concurrency:
  group: bikedash-sync
  cancel-in-progress: false

permissions:
  contents: write   # damit der Job das aktualisierte mobile/today.json committen darf

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # Nachfassen am Morgen dauert höchstens bis 10:00
    # Alle Einstellungen EINMAL für den ganzen Job. Vorher hatte jeder Schritt
    # seine eigene Liste — und der Report-Schritt, der in der Warteschleife
    # den Tagesplan NEU baut (send_report --wait → build_today), kannte weder
    # intervals.icu noch ORS. Folge (07. und 15.11.2026): Sobald der Lauf auf
    # die Recovery wartete, wurde die Zwift-Zustellung „übersprungen" und der
    # Einrichtungs-Check meldete beides als fehlend. Ein neuer Wert gehört
    # nur noch hierher (Checkliste CLAUDE.md 8b, Punkt 4);
    # tests/test_workflow.py prüft das gegen config._ENV_MAP.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
      STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
      WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
      WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
      ATHLETE_HOME_LAT: ${{ secrets.ATHLETE_HOME_LAT }}   # Wetter; today.json bleibt route-frei
      ATHLETE_HOME_LON: ${{ secrets.ATHLETE_HOME_LON }}
      # Zonen und Trainingslast müssen identisch zum Dashboard gerechnet werden.
      ATHLETE_LTHR: ${{ secrets.ATHLETE_LTHR }}
      ATHLETE_FTP: ${{ secrets.ATHLETE_FTP }}
      ATHLETE_WEIGHT_KG: ${{ secrets.ATHLETE_WEIGHT_KG }}
      ATHLETE_SEASON_START: ${{ secrets.ATHLETE_SEASON_START }}
      # Tagesworkout automatisch nach Zwift (über intervals.icu). Fehlen die
      # beiden, wird der Schritt still übersprungen (today.json: zwift.status).
      INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
      INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
      ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sync
        run: python sync.py

      - name: Tagesplan für die PWA bauen (mobile/today.json, route-frei)
        run: python build_today.py

      - name: Morgen-Report und Wochenrückblick aufs Handy (nur wenn fällig)
        # Morgen-Report einmal pro Tag: sobald die heutige Whoop-Recovery da
        # ist, spätestens zur Frist. Wochenrückblick sonntags ab 18 Uhr (der
        # 4-h-Lauf um 20:13 UTC), sonst Montagmorgen nachgeholt. Läuft NACH
        # build_today, damit die Zwift-Zeile stimmt. Fehler hier dürfen den
        # Sync nicht rot machen.
        continue-on-error: true
        # --wait: wartet der Report noch auf die Recovery, fasst derselbe Lauf
        # alle 10 min nach (bis 10:00) und baut dabei Tagesplan + Zwift neu.
        # GitHub verwirft die meisten Morgen-Slots — auf den nächsten Lauf zu
        # hoffen, hieß oft 11:20.
        run: python send_report.py --if-due --weekly-if-due --wait

      - name: today.json committen (nur bei Änderung)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile/today.json
          if git diff --staged --quiet; then
            echo "today.json unverändert – nichts zu committen."
          else
            git commit -m "chore: Tagesplan (today.json) aktualisieren [skip ci]"
            # Der Morgenlauf kann Stunden auf die Recovery warten (send_report
            # --wait); pusht in der Zeit jemand anderes auf main, wird ein
            # nackter Push abgelehnt (Befund 01.11.2026). Deshalb vorher den
            # neuen Stand holen und den eigenen Commit oben drauf setzen;
            # bei Konflikten in today.json gewinnt der frische Tagesplan.
            for attempt in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then
                exit 0
              fi
              echo "Push-Versuch $attempt fehlgeschlagen – neuer Anlauf."
              sleep 5
            done
            exit 1
          fi
