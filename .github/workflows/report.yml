name: Morgen-Report

# Schickt früh den Tages-Report aufs Handy (ntfy). Cron ist in UTC:
# 04:30 UTC = 06:30 in Deutschland (Sommerzeit) bzw. 05:30 (Winterzeit).
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Report senden
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          ATHLETE_HOME_LAT: ${{ secrets.ATHLETE_HOME_LAT }}
          ATHLETE_HOME_LON: ${{ secrets.ATHLETE_HOME_LON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python send_report.py
